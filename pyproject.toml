[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-session-browser"
version = "0.1.0"
description = "Read-only local browser for every OpenCode session stored on Windows and WSL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opencode-session-browser = "opencode_session_browser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencode_session_browser = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
