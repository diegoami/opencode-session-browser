<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Session Tracker</title>
<link rel="stylesheet" href="/track.css">
</head>
<body>
<header>
  <strong>OpenCode Session Tracker</strong>
  <nav><button id="tab-act" class="on">Active sessions</button><button id="tab-id">By id</button></nav>
  <form id="add" autocomplete="off">
    <input id="ids" placeholder="Session id(s): ses_…  (several: separate with spaces or commas)" spellcheck="false">
    <button>Track</button>
  </form>
  <label class="opt" id="actopt" hidden>active = updated in the last <select id="mins"><option>5</option><option selected>10</option><option>30</option><option>120</option><option>1440</option></select> min</label>
  <label class="opt" id="scropt" title="hide runs whose directory is /tmp/oc-* (scratch, allow-test)"><input type="checkbox" id="hidescr" checked> hide /tmp/oc-*</label>
  <label class="opt" id="finopt" title="hide sessions with no open tool call or unfinished reply"><input type="checkbox" id="hidefin"> hide finished</label>
  <label class="opt"><input type="checkbox" id="thinking"> show thinking</label>
  <label class="opt">poll <select id="poll"><option value="2">2 s</option><option value="3" selected>3 s</option><option value="10">10 s</option></select></label>
</header>
<main id="cards"><p class="empty">Enter a session id above. Each tracked session shows its latest steps — tool calls with status and input, and what the model said — and updates live.</p></main>
<main id="active" hidden><p class="empty">loading…</p></main>
<script src="/track.js"></script>
</body>
</html>
